<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取消蔡阿嘎相關頻道訂閱 - YouTube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Roboto", "Arial", sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .unsubscribe-card {
            background-color: #212121;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
        }

        h3 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        /* 每一列頻道的排版 */
        .channel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-row:last-child {
            border-bottom: none;
        }

        .channel-name {
            font-size: 15px;
            font-weight: 400;
            padding-right: 10px;
        }

        /* 仿 YouTube 按鈕樣式 */
        .yt-btn {
            display: inline-block;
            background-color: #f1f1f1;
            color: #0f0f0f;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 18px;
            text-decoration: none;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .yt-btn:hover {
            background-color: #d9d9d9;
        }
    </style>
</head>
<body>

    <div class="unsubscribe-card">
        <h3>管理蔡阿嘎全系列頻道</h3>
        
        <!-- 頻道 1 -->
        <div class="channel-row">
            <div class="channel-name">蔡阿嘎Life (@TsaiAGaLife)</div>
            <a href="https://www.youtube.com/@TsaiAGaLife?sub_confirmation=1" target="_blank" class="yt-btn">變更訂閱</a>
        </div>

        <!-- 頻道 2 -->
        <div class="channel-row">
            <div class="channel-name">嘎嫂二伯&蔡波能The Lifestyle (@2boandbaone)</div>
            <a href="https://www.youtube.com/@2boandbaone?sub_confirmation=1" target="_blank" class="yt-btn">變更訂閱</a>
        </div>

        <!-- 頻道 3 -->
        <div class="channel-row">
            <div class="channel-name">蔡阿嘎543 (@tsaiaga543)</div>
            <a href="https://www.youtube.com/@tsaiaga543?sub_confirmation=1" target="_blank" class="yt-btn">變更訂閱</a>
        </div>

        <!-- 頻道 4 -->
        <div class="channel-row">
            <div class="channel-name">hahababy (@hahababy_official)</div>
            <a href="https://www.youtube.com/@hahababy_official?sub_confirmation=1" target="_blank" class="yt-btn">變更訂閱</a>
        </div>

        <!-- 頻道 5 -->
        <div class="channel-row">
            <div class="channel-name">大頭佛工作室 (@bigbudaudio)</div>
            <a href="https://www.youtube.com/@bigbudaudio?sub_confirmation=1" target="_blank" class="yt-btn">變更訂閱</a>
        </div>

    </div>

</body>
</html>
