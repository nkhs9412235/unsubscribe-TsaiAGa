<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取消訂閱 @TsaiAGa - YouTube</title>
    <style>
        /* 基礎全螢幕重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Roboto", "Arial", sans-serif;
        }

        /* 模擬 YouTube 深色模式背景 */
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 置中的懸浮卡片 */
        .unsubscribe-card {
            background-color: #212121;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }

        /* 標題設定 */
        h3 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 24px;
        }

        /* 讓按鈕容器居中並有適當間距 */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="unsubscribe-card">
        <h3>管理蔡阿嘎的訂閱狀態</h3>
        <p>點擊下方按鈕以變更您對 @TsaiAGa 的訂閱</p>
        
        <div class="btn-container">
            <!-- YouTube 官方按鈕元件 -->
            <div class="g-ytsubscribe" 
                 data-channelid="UC4-GZ0Nlsf-P0w0m3wK4Gsg" 
                 data-layout="full" 
                 data-count="default"
                 data-theme="dark">
            </div>
        </div>
    </div>

    <!-- YouTube 官方 JavaScript SDK -->
    <script src="https://apis.google.com/js/platform.js"></script>

</body>
</html>
