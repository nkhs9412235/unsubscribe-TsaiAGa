<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理蔡阿嘎相關頻道訂閱 - YouTube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Roboto", "Arial", sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .unsubscribe-card {
            background-color: #212121;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 550px;
            width: 100%;
        }
        h3 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }
        .channel-list {
            list-style: none;
        }
        .channel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .channel-row:last-child {
            border-bottom: none;
        }
        .channel-name {
            font-size: 15px;
            font-weight: 400;
            padding-right: 10px;
        }
        .yt-btn {
            display: inline-block;
            background-color: #f1f1f1;
            color: #0f0f0f;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 18px;
            text-decoration: none;
            transition: background-color 0.2s;
            white-space: nowrap;
            border: none;
            cursor: pointer;
        }
        .yt-btn:hover {
            background-color: #d9d9d9;
        }
        .yt-btn:focus {
            outline: 2px solid #3ea6ff;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="unsubscribe-card">
        <h3>管理蔡阿嘎全系列頻道</h3>
        
        <ul class="channel-list">
            <!-- 1. 蔡阿嘎Life -->

                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="yt-btn"
                   aria-label="訂閱蔡阿嘎Life頻道">
                    變更訂閱
                </a>
            </li>

                   target="_blank"

            <!-- 3. 蔡阿嘎543 -->
            <li class="channel-row">

            <!-- 4. hahababy -->
            <li class="channel-row">

            <!-- 5. 大頭佛工作室 -->

            </li>
        </ul>
    </div>
</body>
</html>
