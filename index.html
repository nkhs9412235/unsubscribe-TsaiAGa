<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取消訂閱蔡阿嘎相關頻道 - YouTube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Roboto", "Arial", sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .unsubscribe-card {
            background-color: #212121;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }

        h3 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        /* 仿 YouTube 官方的訂閱/取消訂閱按鈕樣式 */
        .yt-btn {
            display: inline-block;
            background-color: #f1f1f1;
            color: #0f0f0f;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 20px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .yt-btn:hover {
            background-color: #d9d9d9;
        }

        .yt-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="unsubscribe-card">
        <h3>管理 蔡阿嘎 訂閱狀態</h3>
        
        <a href="https://www.youtube.com/@TsaiAGa?sub_confirmation=1" target="_blank" class="yt-btn">
            變更訂閱狀態
        </a>
    </div>

</body>
</html>
